<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Modern font (minimal + clean) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Theme CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

    <!-- Your modern/minimal overrides -->
    <link rel="stylesheet" href="{{ '/assets/css/overrides.css?v=' | append: site.github.build_revision | relative_url }}">

    {% include head-custom.html %}
    {% seo %}
  </head>

  <body>

    <header class="site-header">
      <div class="container">
        <div class="brand">
          <a id="a-title" href="{{ '/' | relative_url }}">
            <h1>{{ site.title | default: site.github.repository_name }}</h1>
          </a>
          <p class="tagline">{{ site.description | default: site.github.project_tagline }}</p>
        </div>

        <nav id="downloads" class="actions">
          {% if site.show_downloads %}
            <a href="{{ site.github.zip_url }}" class="btn">.zip</a>
            <a href="{{ site.github.tar_url }}" class="btn">.tar.gz</a>
          {% endif %}
          <a href="{{ site.github.repository_url }}" class="btn btn-github">
            <span class="icon"></span>GitHub
          </a>
        </nav>
      </div>
    </header>

    <div class="container">
      <section id="main_content">
        {{ content }}
      </section>
    </div>

  </body>
</html>
